
<template>
    <div class="dashboard">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">
                    <lightning-icon
                        icon-name="utility:moneybag"
                        size="small"
                        alternative-text="Platypus Finance">
                    </lightning-icon>
                </div>
                <div>
                    <div class="brand-name">platypus<span>finance</span></div>
                    <div class="brand-caption">FINANCIAL WORKSPACE</div>
                </div>
            </div>

            <div class="topbar-right">
                <span class="live-indicator"></span>
                <span class="workspace-label">Loan operations</span>
                <div class="avatar">PF</div>
            </div>
        </header>

        <div class="dashboard-body">
            <aside class="sidebar">
                <div class="nav-label">WORKSPACE</div>
                <button class="nav-item active" onclick={showDashboard}>
                    <lightning-icon icon-name="utility:dashboard"
                        size="x-small"></lightning-icon>
                    <span>Overview</span>
                </button>
                <button class="nav-item" onclick={openApplications}>
                    <lightning-icon icon-name="utility:form"
                        size="x-small"></lightning-icon>
                    <span>Applications</span>
                </button>
                <button class="nav-item" onclick={openLoans}>
                    <lightning-icon icon-name="utility:money"
                        size="x-small"></lightning-icon>
                    <span>Loans</span>
                </button>
                <button class="nav-item" onclick={openPayments}>
                    <lightning-icon icon-name="utility:payment_gateway"
                        size="x-small"></lightning-icon>
                    <span>Payments</span>
                </button>
                <button class="nav-item" onclick={openCustomers}>
                    <lightning-icon icon-name="utility:people"
                        size="x-small"></lightning-icon>
                    <span>Customers</span>
                </button>

                <div class="sidebar-bottom">
                    <div class="sidebar-note">
                        <lightning-icon icon-name="utility:shield"
                            size="small"></lightning-icon>
                        <p>Secure finance operations</p>
                        <span>Access is controlled by Salesforce permissions.</span>
                    </div>
                    <div class="sidebar-version">PLATYPUS FINANCE · DEV</div>
                </div>
            </aside>

            <main class="main-content">
                <div class="welcome-row">
                    <div>
                        <div class="eyebrow">YOUR WORKSPACE / OVERVIEW</div>
                        <h1>Welcome to Platypus Finance</h1>
                        <p class="subtitle">
                            Here's what's happening across your loan portfolio.
                        </p>
                    </div>
                    <button class="refresh-button" onclick={refreshDashboard}>
                        <lightning-icon icon-name="utility:refresh"
                            size="x-small"></lightning-icon>
                        Refresh
                    </button>
                </div>

                <template lwc:if={errorMessage}>
                    <div class="error-banner" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <template lwc:if={isLoading}>
                    <div class="loading-panel">
                        <lightning-spinner alternative-text="Loading dashboard"
                            size="medium"></lightning-spinner>
                        <p>Loading your finance workspace…</p>
                    </div>
                </template>

                <template lwc:else>
                    <section class="metrics-grid">
                        <article class="metric-card">
                            <div class="metric-heading">
                                <span>Total applications</span>
                                <span class="metric-icon navy">
                                    <lightning-icon icon-name="utility:documents"
                                        size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="metric-value">
                                <lightning-formatted-number
                                    value={metrics.totalApplications}>
                                </lightning-formatted-number>
                            </div>
                            <div class="metric-foot">Applications in your accessible records</div>
                        </article>

                        <article class="metric-card">
                            <div class="metric-heading">
                                <span>Awaiting review</span>
                                <span class="metric-icon amber">
                                    <lightning-icon icon-name="utility:clock"
                                        size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="metric-value">
                                <lightning-formatted-number
                                    value={metrics.pendingReview}>
                                </lightning-formatted-number>
                            </div>
                            <div class="metric-foot">Submitted or under review</div>
                        </article>

                        <article class="metric-card">
                            <div class="metric-heading">
                                <span>Approved</span>
                                <span class="metric-icon green">
                                    <lightning-icon icon-name="utility:success"
                                        size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="metric-value">
                                <lightning-formatted-number
                                    value={metrics.approvedApplications}>
                                </lightning-formatted-number>
                            </div>
                            <div class="metric-foot">Applications approved</div>
                        </article>

                        <article class="metric-card">
                            <div class="metric-heading">
                                <span>Rejected</span>
                                <span class="metric-icon rose">
                                    <lightning-icon icon-name="utility:ban"
                                        size="small"></lightning-icon>
                                </span>
                            </div>
                            <div class="metric-value">
                                <lightning-formatted-number
                                    value={metrics.rejectedApplications}>
                                </lightning-formatted-number>
                            </div>
                            <div class="metric-foot">Applications rejected</div>
                        </article>
                    </section>

                    <section class="portfolio-banner">
                        <div>
                            <div class="banner-eyebrow">APPLICATION PIPELINE</div>
                            <h2>Requested loan amount</h2>
                            <p>Total requested across accessible applications</p>
                        </div>
                        <div class="banner-amount">
                            <lightning-formatted-number
                                value={metrics.totalRequestedAmount}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0">
                            </lightning-formatted-number>
                        </div>
                        <div class="banner-decoration"></div>
                    </section>

                    <section class="applications-panel">
                        <div class="panel-heading">
                            <div>
                                <div class="eyebrow">STAY ON TOP OF YOUR WORK</div>
                                <h2>Recent applications</h2>
                                <p>Latest loan requests available to your user.</p>
                            </div>
                            <button class="text-action" onclick={openApplications}>
                                View applications
                                <lightning-icon icon-name="utility:chevronright"
                                    size="xx-small"></lightning-icon>
                            </button>
                        </div>

                        <div class="table-tools">
                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                placeholder="Search customer, application or status…"
                                value={searchTerm}
                                onchange={handleSearch}>
                            </lightning-input>
                            <span class="result-count">{visibleApplications.length} records</span>
                        </div>

                        <template lwc:if={hasApplications}>
                            <div class="table-wrap">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>APPLICATION</th>
                                            <th>CUSTOMER</th>
                                            <th>SEGMENT</th>
                                            <th>REQUESTED</th>
                                            <th>STATUS</th>
                                            <th>DATE</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={visibleApplications}
                                            for:item="application">
                                            <tr key={application.id}>
                                                <td>
                                                    <span class="application-number">
                                                        {application.applicationNumber}
                                                    </span>
                                                </td>
                                                <td>
                                                    <span class="customer-name">
                                                        {application.customerName}
                                                    </span>
                                                </td>
                                                <td>{application.segment}</td>
                                                <td class="amount-cell">
                                                    <lightning-formatted-number
                                                        value={application.requestedAmount}
                                                        format-style="currency"
                                                        currency-code="INR"
                                                        maximum-fraction-digits="0">
                                                    </lightning-formatted-number>
                                                </td>
                                                <td>
                                                    <span class={application.statusClass}>
                                                        <span class="status-dot"></span>
                                                        {application.status}
                                                    </span>
                                                </td>
                                                <td>
                                                    <lightning-formatted-date-time
                                                        value={application.applicationDate}
                                                        year="numeric"
                                                        month="short"
                                                        day="2-digit"
                                                        time-zone="UTC">
                                                    </lightning-formatted-date-time>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template lwc:else>
                            <div class="empty-state">
                                <lightning-icon icon-name="utility:search"
                                    size="large"></lightning-icon>
                                <h3>No applications found</h3>
                                <p>
                                    Try a different search or check whether your
                                    user can access loan application records.
                                </p>
                            </div>
                        </template>
                    </section>

                    <footer class="dashboard-footer">
                        <span>Platypus Finance</span>
                        <span>Built for clearer lending operations.</span>
                    </footer>
                </template>
            </main>
        </div>
    </div>
</template>
